[package]
name = "can-to-mqtt"
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Read-only SocketCAN telemetry with guided local setup, OBD discovery and verified passive signals"
repository = "https://github.com/askrejans/can-to-mqtt"
keywords = ["can", "obd", "mqtt", "telemetry", "motorsport"]
categories = ["hardware-support", "network-programming"]

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
futures-util = "0.3.34"
prettytable-rs = "0.10.0"
config = "0.15.27"
paho-mqtt = { version = "0.14.0", features = ["vendored-ssl"] }
thiserror = "2.0.21"
lazy_static = "1.5.1"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
hyper = { version = "1.1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sd-notify = "0.4"
chrono = "0.4"
libc = "0.2"
getrandom = "0.4.3"
subtle = "2.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "4.0.0", features = ["tokio"] }
