# Standalone Linux SocketCAN example. Keep the real file private if it holds credentials.
can_interface = "can0"
mode = "obd"                      # obd = Mode 01 reads; passive = zero CAN transmissions
can_format = "auto"               # auto / standard (11-bit) / extended (29-bit)
# obd_response_id = 2024           # Optional selected response CAN ID, decimal 0x7E8
# Only implemented PIDs advertised by the bound ECU are polled. Empty = all available.
enabled_pids = []
poll_interval_high_freq_ms = 20    # One request per tick; fast PID group round-robin
poll_interval_regular_ms = 200

mqtt_base_topic = "/telemetry/car-1/engine" # Choose any broker namespace
# car = "rally-86"                # Legacy optional /g86/<car>/… shortcut
mqtt_host = "127.0.0.1"
mqtt_port = 1883
# mqtt_username = "can-rally-86"
# mqtt_password_file = "/private/path/broker-password"
# mqtt_password = ""             # Prefer the private file; never put secrets in Git
# mqtt_client_id = "can-rally-86"
mqtt_tls = false                  # true for a remote TLS broker
# mqtt_ca_file = "/private/path/broker-ca.pem"
mqtt_keep_alive_secs = 60
mqtt_qos = 0                      # Legacy setting; canonical live telemetry always QoS 0
legacy_scalar_output = false      # true keeps fresh legacy scalar topics during migration

# Passive mode: see docs/PASSIVE_SIGNALS.md. No default vehicle mappings are assumed.
passive_profile = "can"
passive_signals = []

http_enabled = true
http_bind = "127.0.0.1"           # Loopback only, including SSH forwarding
http_port = 9093
# The service creates a random token file (owner-only) when not configured explicitly.
# http_token_file = "/private/path/http-9093.token"
# config_draft_path = "/private/path/draft-9093.json"
# http_token = ""                 # Optional >=32-character secret; never commit a value
prometheus_enabled = true
prometheus_port = 9090            # Metrics and health bind to loopback
log_level = "info"
no_display = true                 # Compatibility flag; current UI is the browser dashboard
